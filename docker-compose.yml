version: "3.9"

services:

  youtube-summarizer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: youtube_summarizer

    ports:
      - "8000:8000"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      WHISPER_SERVICE_URL: http://whisper-service:2000

    depends_on:
      - whisper-service

    restart: unless-stopped

  whisper-service:
    image: whisper_service_image

    container_name: whisper_service

    ports:
      - "2000:2000"

    volumes:
      - whisper_cache:/root/.cache/huggingface

    restart: unless-stopped

volumes:
  whisper_cache: