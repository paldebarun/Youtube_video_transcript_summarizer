version: "3.9"

services:

  youtube-summarizer:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: youtube_summarizer

    ports:
      - "8000:8000"

    environment:
      PORT: ${PORT}
      GROQ_API_KEY: ${GROQ_API_KEY}

      VIDEO_PROCESSING_SERVICE_URL: http://video-processing-service:3000

      WHISPER_SERVICE_URL: http://whisper-service:2000

      OCR_SERVICE_URL: http://ocr-service:4000

      VISION_SERVICE_URL: http://vision-service:9000

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_PASSWORD: ${REDIS_PASSWORD}

      REDIS_DB: 0

      COUCHDB_HOST: couchdb

      COUCHDB_PORT: 5984

      COUCHDB_USERNAME: ${COUCHDB_USERNAME}

      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}

      COUCHDB_DATABASE: youtube_tasks

      MASTER_QUEUE: youtube_master_queue

      SUMMARY_QUEUE: youtube_summary_queue

      EVENT_STREAM: workflow_events

      EVENT_CONSUMER_GROUP: workflow_group

      EVENT_CONSUMER_NAME: workflow_consumer

    depends_on:

      - redis

      - couchdb

      - whisper-service

      - video-processing-service

      - ocr-service

      - vision-service

    restart: unless-stopped

  redis:

    image: redis:7-alpine

    container_name: redis

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  couchdb:

    image: couchdb:3

    container_name: couchdb

    ports:
      - "5984:5984"

    environment:

      COUCHDB_USER: ${COUCHDB_USERNAME}

      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}

    volumes:
      - couchdb_data:/opt/couchdb/data

    restart: unless-stopped

  whisper-service:

    image: whisper_service_image

    container_name: whisper_service

    ports:
      - "2000:2000"

    environment:

      WHISPER_MODEL: small

      DEVICE: cpu

      COMPUTE_TYPE: int8

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_PASSWORD: ${REDIS_PASSWORD}

      REDIS_DB: 0

      WHISPER_QUEUE: whisper_queue

      EVENT_STREAM: workflow_events

      EVENT_CONSUMER_GROUP: workflow_group

      EVENT_CONSUMER_NAME: whisper_service


    volumes:
      - whisper_cache:/root/.cache/huggingface

    restart: unless-stopped

  video-processing-service:

    image: video_processing_service

    container_name: video_processing_service

    ports:
      - "3000:3000"

    environment:

      PORT: 3000

      UPLOAD_DIR: /shared/uploads

      FRAME_DIR: /shared/frames

      AUDIO_DIR: /shared/audio

      SCENE_DETECTION_THRESHOLD: 27.0

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_PASSWORD: ${REDIS_PASSWORD}

      REDIS_DB: 0

      VIDEO_QUEUE: video_queue

      EVENT_STREAM: workflow_events


    volumes:
      - shared_media:/shared

    restart: unless-stopped

  ocr-service:

    image: ocr_service_image

    container_name: ocr_service

    ports:
      - "4000:4000"

    environment:

      PORT: 4000

      OCR_LANGUAGE: en

      USE_GPU: "false"

      MIN_CONFIDENCE: 0.60

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_PASSWORD: ${REDIS_PASSWORD}

      REDIS_DB: 0

      OCR_QUEUE: ocr_queue

      EVENT_STREAM: workflow_events

      EVENT_CONSUMER_GROUP: workflow_group

      EVENT_CONSUMER_NAME: ocr_service


    volumes:
      - shared_media:/shared:ro

    restart: unless-stopped

  vision-service:

    image: vision_service_image

    container_name: vision_service

    ports:
      - "9000:9000"

    environment:

      PORT: 9000

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      VISION_MODEL: google/gemma-4-31b-it:free

      MAX_IMAGES_PER_REQUEST: 5

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_PASSWORD: ${REDIS_PASSWORD}

      REDIS_DB: 0

      VISION_QUEUE: vision_queue

      EVENT_STREAM: workflow_events

      EVENT_CONSUMER_GROUP: workflow_group

      EVENT_CONSUMER_NAME: vision_service

      OPENROUTER_ENDPOINT_URL: https://openrouter.ai/api/v1/chat/completions


    volumes:
      - shared_media:/shared:ro

    restart: unless-stopped

volumes:

  redis_data:

  couchdb_data:

  whisper_cache:

  shared_media: